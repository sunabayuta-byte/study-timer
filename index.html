<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101820">
  <link rel="manifest" href="manifest.webmanifest">
  <title>STUDY TIMER</title>
  <style>
    :root{color-scheme:dark;--bg:#101820;--panel:#192632;--muted:#9aabba;--ink:#f4f7fa;--accent:#a8d5c2}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:22px}
    main{width:min(100%,430px)} .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}
    .brand{font-size:13px;letter-spacing:.2em;font-weight:700}.tag{font-size:11px;color:var(--muted);letter-spacing:.12em}
    .panel{background:var(--panel);border:1px solid #2a3b49;border-radius:24px;padding:26px 20px;text-align:center;box-shadow:0 18px 50px #0003}
    .eyebrow{font-size:11px;letter-spacing:.2em;color:var(--muted)}
    #clock{font-variant-numeric:tabular-nums;font-size:clamp(48px,14vw,68px);font-weight:550;letter-spacing:-.055em;margin:22px 0 25px}
    .actions{display:flex;gap:10px;justify-content:center}
    button{border:0;border-radius:14px;padding:14px 22px;font:600 14px system-ui;cursor:pointer}
    button:focus-visible{outline:3px solid white;outline-offset:3px}
    #toggle{background:var(--accent);color:#102019;min-width:138px}
    #reset{background:#304250;color:var(--ink)}
    .stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
    .stat{background:var(--panel);border:1px solid #2a3b49;border-radius:18px;padding:17px}
    .stat span{display:block;color:var(--muted);font-size:10px;letter-spacing:.12em;margin-bottom:8px}
    .stat strong{font-size:20px;font-variant-numeric:tabular-nums}
    .hint{text-align:center;color:var(--muted);font-size:11px;line-height:1.6;margin-top:22px}
  </style>
</head>
<body>
<main>
  <header class="top"><div class="brand">STUDY TIMER</div><div class="tag">FOCUS MODE</div></header>
  <section class="panel">
    <div class="eyebrow">STOPWATCH</div>
    <div id="clock">00:00:00</div>
    <div class="actions">
      <button id="toggle">START</button>
      <button id="reset">RESET</button>
    </div>
  </section>
  <section class="stats">
    <div class="stat"><span>TODAY'S STUDY</span><strong id="today">00:00:00</strong></div>
    <div class="stat"><span>ALL TIME</span><strong id="total">00:00:00</strong></div>
  </section>
  <p class="hint">計測データはこの端末のブラウザに保存されます。<br>ホーム画面への追加はChromeのメニューから。</p>
</main>
<script>
const $ = id => document.getElementById(id);
const KEY = "studyTimer.v1";
const dayKey = () => new Date().toLocaleDateString("sv-SE");
let state = JSON.parse(localStorage.getItem(KEY) || "null") || {running:false, startedAt:null, elapsed:0, today:{}, total:0};
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }
function fmt(ms){
  let s=Math.floor(ms/1000), h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
  return [h,m,sec].map(n=>String(n).padStart(2,"0")).join(":");
}
function elapsedNow(){return state.elapsed + (state.running ? Math.max(0,Date.now()-state.startedAt) : 0);}
function render(){
  $("clock").textContent=fmt(elapsedNow());
  $("today").textContent=fmt((state.today[dayKey()]||0)+(state.running ? Math.max(0,Date.now()-state.startedAt):0));
  $("total").textContent=fmt(state.total+(state.running ? Math.max(0,Date.now()-state.startedAt):0));
  $("toggle").textContent=state.running?"PAUSE":"START";
}
function commit(){
  if(!state.running)return;
  const delta=Math.max(0,Date.now()-state.startedAt);
  state.elapsed+=delta; state.total+=delta;
  state.today[dayKey()]=(state.today[dayKey()]||0)+delta;
  state.startedAt=null; state.running=false; save(); render();
}
$("toggle").addEventListener("click",()=>{
  if(state.running){commit();}
  else {state.running=true;state.startedAt=Date.now();save();render();}
});
$("reset").addEventListener("click",()=>{
  if(state.running)commit();
  state.elapsed=0;save();render();
});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)render();});
setInterval(render,250); render();
if("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
</body>
</html>
